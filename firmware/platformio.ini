; Nather controller firmware — ESP32 DevKit (ESP32-WROOM-32)
;
;   pio run                     build
;   pio run -t upload           flash the firmware
;   pio run -t uploadfs         flash the website (../web) to LittleFS
;   pio device monitor          serial log at 115200 baud
;
; Library and platform versions are pinned to a major version so a fresh
; clone builds the same way; see docs/DECISIONS.md.

[platformio]
default_envs = esp32dev
data_dir = ../web

[env:esp32dev]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ESP32Async/AsyncTCP@^3.4.0
  ESP32Async/ESPAsyncWebServer@^3.7.0
  bblanchon/ArduinoJson@^7.4.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
