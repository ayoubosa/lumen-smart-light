; Nather controller firmware, ESP32 DevKit (ESP32-WROOM-32)
;
;   pio run                     build
;   pio run -t upload           flash the firmware
;   pio run -t uploadfs         flash the website (../web) to LittleFS
;   pio device monitor          serial log at 115200 baud
;   pio test -e native          run the lighting and Wi-Fi logic tests on this computer
;
; Caret ranges take bug fixes but no breaking changes; see docs/DECISIONS.md.

[platformio]
default_envs = esp32dev
data_dir = ../web

[env:esp32dev]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  ESP32Async/AsyncTCP@^3.4.0
  ESP32Async/ESPAsyncWebServer@^3.7.0
  bblanchon/ArduinoJson@^7.4.0
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=3
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
build_src_filter = +<lights.cpp> +<wifi_policy.cpp>
test_build_src = yes
