name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Rules engine + API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  firmware:
    name: ESP32 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # builds with secrets.example.h placeholders (secrets.h is git-ignored)
      - run: pio run -d firmware
      - run: pio run -d firmware -t buildfs
