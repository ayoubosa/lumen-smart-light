name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Rules engine + API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  firmware:
    name: ESP32 firmware tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install "platformio==6.1.*"
      - name: Lighting and Wi-Fi logic tests (on the runner, no board needed)
        run: pio test -d firmware -e native
      - name: Build firmware
        run: pio run -d firmware -e esp32dev
        env:
          PLATFORMIO_BUILD_FLAGS: -DLUMEN_CI   # use secrets.example.h; secrets.h is git-ignored
      - name: Build website image
        run: pio run -d firmware -e esp32dev -t buildfs
        env:
          PLATFORMIO_BUILD_FLAGS: -DLUMEN_CI
