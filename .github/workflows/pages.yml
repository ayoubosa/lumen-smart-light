name: Deploy demo to GitHub Pages

# Publishes web/ as the live demo. With no controller reachable from an
# HTTPS page, the site runs its in-browser demo mode.

# Manual only while the repository is private: a Pages site is public even
# when the repo is not. Run it from the Actions tab when the project goes public.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
